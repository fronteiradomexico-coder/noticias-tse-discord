name: Monitor de Notícias do TSE

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: monitor-noticias-tse
  cancel-in-progress: false

jobs:
  publicar-noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python noticias.py

      - name: Salvar histórico
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias_enviadas.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar histórico de notícias"
            git push
          else
            echo "Nenhuma alteração no histórico."
          fi
